server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql:///${DB_NAME:ecommerce_db}?host=/cloudsql/${CLOUD_SQL_CONNECTION_NAME}
    username: ${DB_USER:ecommerce_app}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info